# Evita che Supabase (free tier) metta in pausa il progetto dopo 7 giorni di inattività.
# Usa la configurazione pubblica in .env.production (URL + publishable key).
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -a; . ./.env.production; set +a
          curl -fsS "$VITE_SUPABASE_URL/auth/v1/settings" -H "apikey: $VITE_SUPABASE_ANON_KEY" > /dev/null
          curl -fsS "$VITE_SUPABASE_URL/rest/v1/cases?select=id&limit=1" -H "apikey: $VITE_SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase sveglio"
